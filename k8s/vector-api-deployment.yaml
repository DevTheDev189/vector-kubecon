apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-api
  namespace: vector-prod
  labels:
    app: vector-api
    app.kubernetes.io/part-of: vector-kubecon
    radar.skyhook.io/monitored: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vector-api
  template:
    metadata:
      labels:
        app: vector-api
        app.kubernetes.io/part-of: vector-kubecon
        radar.skyhook.io/monitored: "true"
    spec:
      containers:
        - name: vector-api
          image: ghcr.io/devthedev189/vector-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: PUBLIC_BASE_URL
              value: "https://vector.winslow.plus"
            - name: ELASTICSEARCH_URL
              value: "http://elasticsearch.vector-prod.svc.cluster.local:9200"
            - name: RUST_LOG
              value: "info,backend_api=debug"
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: vector-secrets
                  key: session-secret
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vector-secrets
                  key: openai-api-key
                  optional: true
            - name: DASH0_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: vector-config
                  key: dash0-endpoint
                  optional: true
            - name: DASH0_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vector-secrets
                  key: dash0-token
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: vector-api
  namespace: vector-prod
  labels:
    app: vector-api
    app.kubernetes.io/part-of: vector-kubecon
spec:
  type: NodePort
  selector:
    app: vector-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
