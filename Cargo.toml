[workspace]
resolver = "2"
members = [
    "backend-api",
    "crowd-simulator",
]

[workspace.dependencies]
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["cookie"] }
tokio = { version = "1.40", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
time = "0.3"
uuid = { version = "1.10", features = ["v4", "serde"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
subtle = "2.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = { version = "0.26", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio", "trace", "metrics"] }
opentelemetry-otlp = { version = "0.26", default-features = false, features = ["http-proto", "reqwest-client"] }
tracing-opentelemetry = "0.27"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
clap = { version = "4.5", features = ["derive"] }
